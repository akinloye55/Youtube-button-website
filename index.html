
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IMOLEISLAM</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #202020;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: red;
    font-size: 25px;
    font-weight: bold;
}

.search {
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #555;
    background: #333;
    color: white;
    width: 45%;
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 15px;
}

.video {
    background: linear-gradient(135deg, #600000, #171717);
    height: 230px;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 65px;
}

h2 {
    margin-top: 25px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 25px;
    margin: 6px 3px;
    cursor: pointer;
    font-weight: bold;
}

.like {
    background: #333;
    color: white;
}

.subscribe {
    background: red;
    color: white;
}

.subscribed {
    background: #555;
    color: white;
}

.other {
    background: #333;
    color: white;
}

.comment-box {
    margin-top: 30px;
}

input {
    padding: 13px;
    width: 70%;
    background: #292929;
    border: 1px solid #555;
    color: white;
    border-radius: 8px;
}

.comment {
    background: #222;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
}

footer {
    text-align: center;
    padding: 25px;
    color: gray;
}

@media(max-width: 500px) {
    .container {
        padding: 12px;
    }

    .video {
        height: 180px;
    }

    input {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">▶ YouTube</div>
    <input class="search" type="search"
    placeholder="Search videos...">
</header>

<div class="container">

    <div class="video">▶</div>

    <h2>Welcome to IMOLEISLAM</h2>

    <p>Welcome to my channel IMOLEISLAM!
    Subscribe and enjoy Islamic videos.</p>

    <h3>
        👥 Subscribers:
        <span id="subCount">0</span>
    </h3>

    <button class="like" onclick="likeVideo()">
        👍 Like <span id="likeCount">0</span>
    </button>

    <button id="subButton"
    class="subscribe" onclick="subscribe()">
        Subscribe
    </button>

    <button class="other" onclick="notify()">
        🔔 Notifications
    </button>

    <button class="other" onclick="shareVideo()">
        Share
    </button>

    <p id="message">Welcome to my IMOLEISLAM!</p>

    <hr>

    <div class="comment-box">

        <h2>Comments</h2>

        <input id="commentInput"
        type="text" placeholder="Write a comment...">

        <button class="subscribe"
        onclick="addComment()">Post</button>

        <div id="comments"></div>

    </div>

</div>

<footer>
    My YouTube Website © 2026
</footer>

<script>

let likes = 0;
let subscribers = 0;
let isSubscribed = false;

function likeVideo() {
    likes++;

    document.getElementById("likeCount")
    .innerText = likes;

    document.getElementById("message")
    .innerText = "Thank you for liking!";
}

function subscribe() {

    if (!isSubscribed) {
        subscribers++;
        isSubscribed = true;

        document.getElementById("subButton")
        .innerText = "Subscribed";

        document.getElementById("subButton")
        .className = "subscribed";

        document.getElementById("message")
        .innerText = "Thank you for subscribing!";
    }

    else {
        subscribers--;
        isSubscribed = false;

        document.getElementById("subButton")
        .innerText = "Subscribe";

        document.getElementById("subButton")
        .className = "subscribe";

        document.getElementById("message")
        .innerText = "You unsubscribed.";
    }

    document.getElementById("subCount")
    .innerText = subscribers;
}

function notify() {
    document.getElementById("message")
    .innerText = "Notifications turned on!";
}

function shareVideo() {
    if (navigator.share) {
        navigator.share({
            title: "My YouTube Channel",
            url: window.location.href
        });
    } else {
        document.getElementById("message")
        .innerText = "Copy this website link to share!";
    }
}

function addComment() {

    let input = document.getElementById("commentInput");

    if (input.value.trim() === "") {
        alert("Please write a comment first!");
        return;
    }

    let newComment = document.createElement("div");

    newComment.className = "comment";
    newComment.textContent = input.value;

    document.getElementById("comments")
    .prepend(newComment);

    input.value = "";
}

</script>

</body>
</html>
